name: c8 stock terminal gates
on:
  push:
    branches: [verify-488-npm-shells]
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'businessdeveloper69/c8'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c71d1e862685521cb56cd0e6bc39a61a6a74a0a0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm i monocart-coverage-reports@2 --save-dev
      - run: npm test
  windows:
    if: github.repository == 'businessdeveloper69/c8'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c71d1e862685521cb56cd0e6bc39a61a6a74a0a0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm config set update-notifier false
      - run: npm ci
      - run: npm i monocart-coverage-reports@2 --save-dev
      - run: npm test
  coverage:
    if: github.repository == 'businessdeveloper69/c8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c71d1e862685521cb56cd0e6bc39a61a6a74a0a0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm i monocart-coverage-reports@2 --save-dev
      - run: npm run coverage
